name: Build, test, and publish images

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: v2-koyeb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint entrypoint
        run: shellcheck entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build smoke-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: v2-koyeb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail

          container_name="v2-koyeb-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "${container_name}" || true
            docker rm --force "${container_name}" || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${container_name}" \
            --publish 127.0.0.1:18080:8080 \
            --env UUID=7b21e8d4-8b31-4dd8-a2c8-394ea642ce47 \
            v2-koyeb:test

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_name}")" != "true" ]]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --show-error http://127.0.0.1:18080/healthz
          test "$(docker inspect --format '{{.State.Health.Status}}' "${container_name}")" != "unhealthy"

          if docker run --rm --env UUID=invalid v2-koyeb:test; then
            echo "The container unexpectedly accepted an invalid UUID." >&2
            exit 1
          fi

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
    steps:
      - name: Check Docker Hub configuration
        id: registry
        shell: bash
        run: |
          if [[ -n "${DOCKER_USERNAME}" && -n "${DOCKER_PASSWORD}" && -n "${DOCKER_REPO}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Docker Hub publishing skipped because DOCKER_USERNAME, DOCKER_PASSWORD, or DOCKER_REPO is not configured."
          fi

      - name: Set up QEMU
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and publish multi-platform image
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: "{{defaultContext}}"
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_REPO }}:v5.52.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
